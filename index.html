<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KBO ABS 트래킹 시스템 - 30cm 초근접 백색 야구공 즉시 인식 & 10인 로스터</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Pretendard / Orbitron / Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', 'sans-serif'],
            display: ['"Orbitron"', '"Noto Sans KR"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            abs: {
              bg: '#060a12',
              panel: '#0d1526',
              cyan: '#00f0ff',
              strike: '#ffb800',
              strikeRed: '#ff2a5f',
              ball: '#00e676',
              ballBlue: '#00b0ff',
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #050811;
      color: #f1f5f9;
      font-family: 'Noto Sans KR', sans-serif;
      overflow-x: hidden;
    }

    .cyber-bg {
      background-color: #050811;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.14) 0%, transparent 55%),
        radial-gradient(circle at 85% 90%, rgba(255, 184, 0, 0.08) 0%, transparent 45%),
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
    }

    .neon-card {
      background: rgba(11, 19, 35, 0.86);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 240, 255, 0.22);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55), inset 0 0 18px rgba(0, 240, 255, 0.04);
    }

    .neon-border-strike {
      border: 2px solid #ffb800;
      box-shadow: 0 0 28px rgba(255, 184, 0, 0.55), inset 0 0 16px rgba(255, 42, 95, 0.35);
    }

    .neon-border-ball {
      border: 2px solid #00e676;
      box-shadow: 0 0 28px rgba(0, 230, 118, 0.5), inset 0 0 16px rgba(0, 176, 255, 0.3);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(30, 41, 59, 0.9);
      height: 6px;
      border-radius: 999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00f0ff;
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px #00f0ff;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    @keyframes callBannerPop {
      0% { transform: translate(-50%, -20%) scale(0.5); opacity: 0; }
      45% { transform: translate(-50%, 0%) scale(1.08); opacity: 1; }
      70% { transform: translate(-50%, 0%) scale(0.97); opacity: 1; }
      100% { transform: translate(-50%, 0%) scale(1); opacity: 1; }
    }

    .animate-call-banner {
      animation: callBannerPop 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .led-off {
      background-color: #1e293b;
      border: 1px solid #334155;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
    }
    .led-ball {
      background-color: #00e676;
      border: 1px solid #a7f3d0;
      box-shadow: 0 0 12px #00e676, 0 0 4px #ffffff;
    }
    .led-strike {
      background-color: #ffb800;
      border: 1px solid #fde68a;
      box-shadow: 0 0 12px #ffb800, 0 0 4px #ffffff;
    }
    .led-out {
      background-color: #ff2a5f;
      border: 1px solid #fecdd3;
      box-shadow: 0 0 12px #ff2a5f, 0 0 4px #ffffff;
    }

    @keyframes recPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
    }
    .rec-shutter-active {
      animation: recPulse 1.4s infinite;
    }

    body.dual-compact-mode #trackingHeaderBar {
      padding-top: 4px;
      padding-bottom: 4px;
    }
    body.dual-compact-mode #viewportContainer {
      height: 78vh !important;
      min-height: 290px !important;
    }
